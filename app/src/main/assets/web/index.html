<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BiliDownloader Mobile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="top-nav">
            <div class="brand">
                <div class="logo-circle">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="#00A1D6">
                        <path d="M19.35,10.04C18.67,6.59 15.64,4 12,4 9.11,4 6.6,5.64 5.35,8.04 2.34,8.36 0,10.91 0,14c0,3.31 2.69,6 6,6h13c2.76,0 5,-2.24 5,-5 0,-2.64 -2.05,-4.78 -4.65,-4.96zM17,13l-5,5 -5,-5h3V9h4v4h3z"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>BiliDownloader</h1>
                    <span class="badge-sub">Mobile · Android 16</span>
                </div>
            </div>
            <div class="actions">
                <button id="btn-login" class="icon-btn" title="B站账号登录">
                    <span id="user-status-text">登录B站</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- Input Card -->
            <section class="card input-card">
                <div class="card-header">
                    <span class="card-title">视频链接解析</span>
                    <span id="platform-badge" class="platform-badge hidden">未知平台</span>
                </div>
                <div class="input-wrapper">
                    <textarea id="url-input" placeholder="粘贴 B站、抖音、快手 的分享链接或视频地址..." rows="3"></textarea>
                </div>
                <div class="btn-group">
                    <button id="btn-paste" class="btn btn-secondary">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/>
                        </svg>
                        读取剪贴板
                    </button>
                    <button id="btn-parse" class="btn btn-primary">
                        <span id="parse-spinner" class="spinner hidden"></span>
                        <span id="parse-text">开始解析</span>
                    </button>
                </div>
            </section>

            <!-- Video Preview Card -->
            <section id="preview-card" class="card preview-card hidden">
                <div class="preview-media">
                    <img id="preview-cover" src="" alt="封面">
                    <div id="preview-duration" class="duration-badge">00:00</div>
                </div>
                <div class="preview-info">
                    <h3 id="preview-title">视频标题</h3>
                    <div class="meta-row">
                        <span id="preview-author" class="author">UP主/作者</span>
                        <span id="preview-platform" class="tag">Bilibili</span>
                    </div>

                    <!-- Quality selector -->
                    <div class="quality-selector-box">
                        <label for="quality-select">选择下载画质：</label>
                        <select id="quality-select" class="quality-select">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <button id="btn-download" class="btn btn-download">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                        </svg>
                        下载并保存到系统相册
                    </button>
                </div>
            </section>

            <!-- Tasks Card -->
            <section class="card tasks-card">
                <div class="card-header">
                    <span class="card-title">下载队列与任务</span>
                    <span id="task-count" class="count-badge">0</span>
                </div>
                <div id="task-list" class="task-list">
                    <div class="empty-hint">暂无下载任务，解析视频后即可一键下载</div>
                </div>
            </section>
        </main>

        <!-- QR Code Login Modal -->
        <div id="qr-modal" class="modal hidden">
            <div class="modal-backdrop"></div>
            <div class="modal-card">
                <div class="modal-header">
                    <h3>B站扫码登录</h3>
                    <button id="btn-close-modal" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <p class="sub-hint">登录后可解锁 4K、1080P60 等大会员专属高清画质</p>
                    <div class="qr-container">
                        <img id="qr-image" src="" alt="登录二维码">
                        <div id="qr-loading" class="qr-loading">生成中...</div>
                    </div>
                    <div id="qr-status" class="qr-status">请打开 哔哩哔哩手机客户端 扫码</div>
                    <button id="btn-refresh-qr" class="btn btn-secondary btn-sm">刷新二维码</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
